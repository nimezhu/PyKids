# tmux settings for the PyKids coding cockpit.
# Loaded on a private socket (tmux -L pykids), so it never touches your normal tmux.

set -g mouse on
set -g default-terminal "screen-256color"   # tmux-256color is missing from macOS terminfo
set -sg escape-time 10
set -g history-limit 5000
set -g allow-rename off

# Pane labels ("CODE" / "OUTPUT") come from a per-pane user option set by ./learn
set -g pane-border-status top
set -g pane-border-format " #{?pane_active,#[bold],}#{@label} "
set -g pane-border-style "fg=colour240"
set -g pane-active-border-style "fg=colour45"

# Status bar: one tab per open file (click to switch) + key hints
set -g status-position bottom
set -g status-style "bg=colour25,fg=white"
set -g status-left " 🐍 PyKids  "
set -g status-left-length 20
set -g status-right-length 80
set -g window-status-format " #W "
set -g window-status-current-format "#[bg=colour45,fg=black,bold] #W "
set -g message-style "bg=colour220,fg=black"
